  function yard() {
    const ctx = one(&quot;#c-hive-yard&quot;).getContext(&quot;2d&quot;);
    if (!ctx) return;
    const rect = (color,x,y,w,h) =&gt; { ctx.fillStyle = color; ctx.fillRect(x,y,w,h); };
    const stripes = [
      [46,14,18,3], [41,17,29,4], [36,21,39,5], [30,26,51,8],
      [25,34,61,9], [20,43,71,11], [16,54,79,12], [19,66,74,6]
    ];
    for (const [x,y,w,h] of stripes) {
      rect(&quot;#5b311b&quot;,x-2,y-2,w+4,h+4);
    }
    for (const [x,y,w,h] of stripes) {
      rect(&quot;#dd882b&quot;,x,y,w,h);
      rect(&quot;#ffcb57&quot;,x+2,y,w-8,h-2);
      rect(&quot;#ffe999&quot;,x+6,y+1,Math.max(4,w-22),2);
      rect(&quot;#a95220&quot;,x+5,y+h-2,w-8,2);
      rect(&quot;#f4ae44&quot;,x+w-10,y+2,6,h-4 &gt; 0 ? h-4 : 1);
    }
    rect(&quot;#68371d&quot;,51,11,11,3); rect(&quot;#e99c36&quot;,54,9,5,3); rect(&quot;#ffe484&quot;,54,9,3,1);
    rect(&quot;#6d381d&quot;,40,52,29,23); rect(&quot;#6d381d&quot;,43,47,23,7);
    rect(&quot;#f5a437&quot;,43,53,23,20); rect(&quot;#ffcf5a&quot;,46,49,17,7);
    rect(&quot;#63391f&quot;,46,57,17,16); rect(&quot;#63391f&quot;,49,54,11,5);
    rect(&quot;#3c2519&quot;,48,57,13,16); rect(&quot;#855537&quot;,48,58,2,13);
    rect(&quot;#b6783e&quot;,54,56,1,15); rect(&quot;#f7ba49&quot;,57,65,2,2);
    rect(&quot;#743c1b&quot;,78,58,10,8); rect(&quot;#ffd96e&quot;,79,59,8,6); rect(&quot;#9e4c20&quot;,82,59,2,6);
    for (let x = 0; x &lt; 104; x += 2) {
      const ridge = 67 + Math.round(3 * Math.sin(x / 7) + 2 * Math.cos(x / 3.6));
      if (x &lt; 42 || x &gt; 66) rect(&quot;#50643a&quot;,x,ridge,2,77-ridge);
      rect(&quot;#78873e&quot;,x,ridge+4,2,8);
      if (x % 6) rect(&quot;#a2a750&quot;,x+1,74+(x%3),2,2);
    }
    rect(&quot;#a67543&quot;,35,72,37,5); rect(&quot;#eabb75&quot;,43,71,22,5);
    rect(&quot;#d59254&quot;,47,74,9,2); rect(&quot;#f7d691&quot;,49,72,14,2);
    for (const [x,y,color] of [[5,65,&quot;#f7a4a0&quot;],[12,70,&quot;#fff0ae&quot;],[22,65,&quot;#f4b2c1&quot;],[31,72,&quot;#ffec9f&quot;],[75,71,&quot;#f9c172&quot;],[94,68,&quot;#f4a4a5&quot;],[99,72,&quot;#fff0b3&quot;],[82,73,&quot;#ffefa9&quot;]]) {
      rect(&quot;#658c4b&quot;,x,y+2,1,5); rect(color,x-1,y+1,3,1); rect(color,x,y,1,3);
      rect(&quot;#be7425&quot;,x,y+1,1,1);
    }
    for (const [x,y] of [[25,22],[20,19],[16,15],[17,11],[21,9],[27,10],[33,9],[38,6],[43,4]]) rect(&quot;#a56a34&quot;,x,y,2,1);
  }

    const project = projects.find((record) =&gt; record.job === item.id);
    return &#x27;&lt;article class=&quot;c-frame c-entry c-job-card&quot;&gt;&lt;div class=&quot;c-job-head&quot;&gt;&#x27; + tileGlyph(project.sprite) +
      &#x27;&lt;div&gt;&lt;small&gt;&#x27; + safe(item.org) + &#x27;&lt;/small&gt;&lt;h2&gt;&#x27; + safe(item.title) + &#x27;&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&#x27; + safe(item.description) + &#x27;&lt;/p&gt;&#x27; +
      &#x27;&lt;div class=&quot;c-job-foot&quot;&gt;&lt;dl class=&quot;c-job-facts&quot;&gt;&lt;div&gt;&lt;dt&gt;Remuneração&lt;/dt&gt;&lt;dd&gt;&#x27; + safe(item.pay) +
      &#x27;&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Modalidade&lt;/dt&gt;&lt;dd&gt;&#x27; + safe(item.place) + &#x27;&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Tipo&lt;/dt&gt;&lt;dd&gt;&#x27; + safe(item.kind) +
      &#x27;&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;button type=&quot;button&quot; data-job=&quot;&#x27; + item.id + &#x27;&quot; class=&quot;c-gold c-job-action&quot;&gt;Ver oportunidade &lt;span aria-hidden=&quot;true&quot;&gt;▸&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;&lt;/article&gt;&#x27;;

  function renderPage() {
    let body = &quot;&quot;;
    if (page === &quot;discover&quot;) {
      const terms = normalized(search).trim().split(/\s+/).filter(Boolean);
      const matches = (text) =&gt; terms.every((term) =&gt; normalized(text).includes(term));
      const list = jobs.filter((item) =&gt; matches(Object.values(item).join(&quot; &quot;))).map(jobEntry);
      const users = people.filter((item) =&gt; matches(item.name + &quot; &quot; + item.role)).map((item) =&gt; &#x27;&lt;div class=&quot;c-frame c-entry&quot;&gt;&#x27; + person(item) + &#x27;&lt;/div&gt;&#x27;);
      const projectResults = projects.filter((item) =&gt; matches(item.name + &quot; &quot; + item.text)).map((item) =&gt;
        entry(item.name, &#x27;&lt;small&gt;Projeto&lt;/small&gt;&lt;p&gt;&#x27; + safe(item.text) + &#x27;&lt;/p&gt;&lt;button type=&quot;button&quot; data-project-detail=&quot;&#x27; + item.id + &#x27;&quot; class=&quot;c-link&quot;&gt;Ver projeto →&lt;/button&gt;&#x27;));
      const count = list.length + users.length + projectResults.length;
      body = (search ? &#x27;&lt;p&gt;&#x27; + count + (count === 1 ? &#x27; resultado&#x27; : &#x27; resultados&#x27;) + &#x27; para “&#x27; + safe(search) + &#x27;”&lt;/p&gt;&#x27; : &quot;&quot;) +
        (projectResults.concat(list).join(&quot;&quot;) + (users.length ? &#x27;&lt;div class=&quot;c-people-grid&quot;&gt;&#x27; + users.join(&quot;&quot;) + &#x27;&lt;/div&gt;&#x27; : &#x27;&#x27;) || entry(&quot;Nenhum resultado&quot;, &#x27;&lt;p&gt;Experimente outro nome ou habilidade.&lt;/p&gt;&#x27;));
    } else if (page === &quot;opportunities&quot;) {
      body = jobs.map(jobEntry).join(&quot;&quot;);
    } else if (page === &quot;network&quot;) {
      body = &#x27;&lt;div class=&quot;c-people-grid&quot;&gt;&#x27; + people.map((item) =&gt; &#x27;&lt;article class=&quot;c-frame c-entry&quot;&gt;&#x27; + person(item) + &#x27;&lt;/article&gt;&#x27;).join(&quot;&quot;) + &#x27;&lt;/div&gt;&#x27;;
    } else if (page === &quot;messages&quot;) {
      body = Array.from(threads, ([id, messages]) =&gt; {
        const item = people.find((person) =&gt; person.id === id);
        return &#x27;&lt;article class=&quot;c-frame c-entry c-message-card&quot;&gt;&lt;div class=&quot;c-msg-summary&quot;&gt;&#x27; + portrait(id) +
          &#x27;&lt;div&gt;&lt;h2&gt;&#x27; + safe(item.name) + &#x27;&lt;/h2&gt;&lt;p&gt;&#x27; + safe(messages.at(-1).body) + &#x27;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&#x27; +
          &#x27;&lt;button type=&quot;button&quot; class=&quot;c-link&quot; data-conversation=&quot;&#x27; + id + &#x27;&quot;&gt;Abrir conversa →&lt;/button&gt;&lt;/article&gt;&#x27;;
      }).join(&quot;&quot;);
    } else if (page === &quot;saved&quot;) {
      body = posts.filter((item) =&gt; saved.has(item.id)).map((item) =&gt; post(item)).join(&quot;&quot;) ||
        entry(&quot;Nenhuma publicação salva&quot;, &#x27;&lt;p&gt;Use o marcador em um post para encontrar a publicação aqui.&lt;/p&gt;&#x27;);
    } else if (page === &quot;alerts&quot;) {
      body = &#x27;&lt;article class=&quot;c-frame c-entry c-alert-card&quot;&gt;&lt;h2&gt;Nova mensagem de Diogo Alves&lt;/h2&gt;&lt;button type=&quot;button&quot; class=&quot;c-link&quot; data-view=&quot;messages&quot;&gt;Abrir mensagens →&lt;/button&gt;&lt;/article&gt;&#x27; +
        &#x27;&lt;article class=&quot;c-frame c-entry c-alert-card&quot;&gt;&lt;h2&gt;Pixel Garden publicou uma oportunidade&lt;/h2&gt;&lt;button type=&quot;button&quot; class=&quot;c-link&quot; data-job=&quot;pixel&quot;&gt;Ver detalhes →&lt;/button&gt;&lt;/article&gt;&#x27;;
    }
    one(&quot;#c-screen-items&quot;).innerHTML = body;
    repaint();
  }

  function navigate(nextPage, source) {
    if (!Object.hasOwn(pages, nextPage)) return;
    page = nextPage;
    root.dataset.section = page;
    one(&#x27;[data-page=&quot;feed&quot;]&#x27;).hidden = page !== &quot;feed&quot;;
    one(&#x27;[data-page=&quot;secondary&quot;]&#x27;).hidden = page === &quot;feed&quot; || page === &quot;profile&quot;;
    one(&#x27;[data-page=&quot;profile&quot;]&#x27;).hidden = page !== &quot;profile&quot;;
    one(&quot;#c-profile-mini&quot;).hidden = page === &quot;profile&quot;;
    one(&quot;.c-profile-rail&quot;).hidden = page !== &quot;profile&quot;;
    if (page === &quot;feed&quot;) renderFeed();
    else if (page === &quot;profile&quot;) renderProfile();
    else {
      one(&quot;#c-screen-title&quot;).textContent = pages[page];
      renderPage();
    }
    all(&quot;.c-nav [data-view], .c-header-actions [data-view]&quot;).forEach((button) =&gt; {
      if (button.dataset.view === page) button.setAttribute(&quot;aria-current&quot;, &quot;page&quot;);
      else button.removeAttribute(&quot;aria-current&quot;);
    });
    const account = one(&quot;.c-account&quot;);
    if (page === &quot;profile&quot; &amp;&amp; profilePerson === viewer) account.setAttribute(&quot;aria-current&quot;, &quot;page&quot;);
    else account.removeAttribute(&quot;aria-current&quot;);
    if (source &amp;&amp; (!source.isConnected || source.closest(&quot;[hidden]&quot;))) {
      all(&quot;.c-nav [data-view], .c-header-actions [data-view]&quot;).find((button) =&gt; button.dataset.view === page)?.focus();
    }
    status((page === &quot;profile&quot; ? profilePerson.name : pages[page]) + &quot;.&quot;);
  }

  function open(title, html, source) {
    if (!dialog.open || (source &amp;&amp; !dialog.contains(source))) trigger = source;
    one(&quot;#c-dialog-title&quot;).textContent = title;
    dialogInfo.innerHTML = html;
    repaint();
    if (!dialog.open) dialog.showModal();
  }

  function commentBox(item, source) {
    open(&quot;Comentários&quot;, (item.comments.map((text) =&gt; &#x27;&lt;p&gt;&#x27; + safe(text) + &#x27;&lt;/p&gt;&#x27;).join(&quot;&quot;) || &quot;&lt;p&gt;Seja a primeira pessoa a comentar.&lt;/p&gt;&quot;) +
      &#x27;&lt;form class=&quot;c-reply&quot; data-comment-form=&quot;&#x27; + item.id + &#x27;&quot;&gt;&lt;label for=&quot;c-reply&quot;&gt;Seu comentário&lt;/label&gt;&lt;textarea id=&quot;c-reply&quot; required maxlength=&quot;700&quot;&gt;&lt;/textarea&gt;&lt;button type=&quot;submit&quot; class=&quot;c-gold&quot;&gt;Comentar ▸&lt;/button&gt;&lt;/form&gt;&#x27;, source);
  }

  function conversation(id, source) {
    const item = people.find((person) =&gt; person.id === id);
    if (!item) return;
    activeThread = id;
    const history = threads.get(id) ?? [];
    open(item.name, (history.length ? history.map((message) =&gt; &#x27;&lt;p&gt;&lt;strong&gt;&#x27; + safe(message.sender) + &#x27;&lt;/strong&gt; &#x27; +
      safe(message.body) + &#x27;&lt;/p&gt;&#x27;).join(&quot;&quot;) : &#x27;&lt;p&gt;Inicie a conversa com &#x27; + safe(item.name.split(&quot; &quot;)[0]) + &#x27;.&lt;/p&gt;&#x27;) +
      &#x27;&lt;form class=&quot;c-reply&quot; data-reply-form&gt;&lt;label for=&quot;c-reply&quot;&gt;Sua mensagem&lt;/label&gt;&lt;textarea id=&quot;c-reply&quot; required maxlength=&quot;700&quot;&gt;&lt;/textarea&gt;&lt;button type=&quot;submit&quot; class=&quot;c-gold&quot;&gt;Responder ▸&lt;/button&gt;&lt;/form&gt;&#x27;, source);
  }

  function editProfile(source) {
    open(&quot;Editar perfil&quot;, &#x27;&lt;form class=&quot;c-edit&quot; data-edit-form&gt;&lt;label for=&quot;c-edit-role&quot;&gt;Profissão ou área&lt;/label&gt;&#x27; +
      &#x27;&lt;input id=&quot;c-edit-role&quot; required maxlength=&quot;80&quot; value=&quot;&#x27; + safe(viewer.role) + &#x27;&quot;&gt;&lt;label for=&quot;c-edit-location&quot;&gt;Localização&lt;/label&gt;&#x27; +
      &#x27;&lt;input id=&quot;c-edit-location&quot; maxlength=&quot;48&quot; value=&quot;&#x27; + safe(viewer.location) + &#x27;&quot;&gt;&lt;label for=&quot;c-edit-about&quot;&gt;Sobre você&lt;/label&gt;&#x27; +
      &#x27;&lt;textarea id=&quot;c-edit-about&quot; required maxlength=&quot;360&quot;&gt;&#x27; + safe(viewer.about) + &#x27;&lt;/textarea&gt;&lt;button type=&quot;submit&quot; class=&quot;c-gold&quot;&gt;Salvar alterações ▸&lt;/button&gt;&lt;/form&gt;&#x27;, source);
  }

  root.addEventListener(&quot;click&quot;, (event) =&gt; {
    const button = event.target.closest(&quot;button&quot;);
    if (!button) return;
    const data = button.dataset;
    if (data.profile) {
      if (dialog.open) {
        trigger = null;
        dialog.close();
      }
      showProfile(data.profile, button);
    } else if (data.profileTab) {
      profileTab = data.profileTab;
      renderProfilePanel();
    } else if (Object.hasOwn(data, &quot;profileBack&quot;)) {
      navigate(profileReturnPage, button);
    } else if (Object.hasOwn(data, &quot;editProfile&quot;)) {
      editProfile(button);
    } else if (data.social) {
      const list = profilePerson[data.social].map((id) =&gt; directory.find((item) =&gt; item.id === id));
      open(socialLabels[data.social], list.length ? list.map((item) =&gt; &#x27;&lt;div class=&quot;c-social-person&quot;&gt;&#x27; + portrait(item.id) +
        &#x27;&lt;button type=&quot;button&quot; class=&quot;c-link&quot; data-profile=&quot;&#x27; + item.id + &#x27;&quot;&gt;&#x27; + safe(item.name) + &#x27;&lt;/button&gt;&lt;/div&gt;&#x27;).join(&quot;&quot;) :
        &#x27;&lt;p&gt;Esta lista ainda está vazia.&lt;/p&gt;&#x27;, button);
    } else if (data.projectDetail) {
      const item = projects.find((project) =&gt; project.id === data.projectDetail);
      if (!item) return;
      open(item.name, &#x27;&lt;p&gt;&#x27; + safe(item.text) + &#x27;&lt;/p&gt;&#x27; + (item.job ? &#x27;&lt;button type=&quot;button&quot; class=&quot;c-gold&quot; data-job=&quot;&#x27; +
        item.job + &#x27;&quot;&gt;Ver oportunidade ▸&lt;/button&gt;&#x27; : &#x27;&#x27;), button);
    } else if (data.view) {
      if (data.view === &quot;discover&quot;) { search = &quot;&quot;; one(&quot;#c-q&quot;).value = &quot;&quot;; }
      navigate(data.view, button);
    } else if (Object.hasOwn(data,&quot;night&quot;)) {
      const night = root.dataset.theme !== &quot;night&quot;;
      root.dataset.theme = night ? &quot;night&quot; : &quot;day&quot;;
      button.firstElementChild.textContent = night ? &quot;☀&quot; : &quot;☾&quot;;
      one(&quot;[data-theme-label]&quot;).textContent = night ? &quot;Dia&quot; : &quot;Noite&quot;;
    } else if (Object.hasOwn(data,&quot;queen&quot;)) {
      open(&quot;Rainha Bia&quot;, &#x27;&lt;div class=&quot;c-queen-art&quot;&gt;&lt;img class=&quot;c-queen-portrait&quot; alt=&quot;Bia, a abelha mascote&quot; src=&quot;&#x27; + biaArt + &#x27;&quot;&gt;&#x27; + sprite(&quot;crown&quot;) + &#x27;&lt;/div&gt;&lt;p&gt;Bia é a mascote do Collab Hub. Comece pelo feed para acompanhar seus projetos ou explore oportunidades para encontrar onde colaborar.&lt;/p&gt;&lt;button class=&quot;c-link&quot; type=&quot;button&quot; data-guide&gt;Explorar oportunidades →&lt;/button&gt;&#x27;, button);
    } else if (Object.hasOwn(data,&quot;guide&quot;)) {
      trigger = one(&#x27;.c-nav [data-view=&quot;opportunities&quot;]&#x27;);
      dialog.close();
      navigate(&quot;opportunities&quot;);
    } else if (data.mode) {
      mode = data.mode;
      renderFeed();
      status(mode === &quot;all&quot; ? &quot;Publicações para você.&quot; : &quot;Publicações da sua rede.&quot;);
    } else if (data.job) {
      const item = jobs.find((job) =&gt; job.id === data.job);
      if (!item) return;
      open(item.title, &#x27;&lt;p&gt;&lt;small&gt;&#x27; + safe(item.org + &quot; · &quot; + item.kind + &quot; · &quot; + item.place) + &#x27;&lt;/small&gt;&lt;/p&gt;&lt;p&gt;&#x27; + safe(item.description) +
        &#x27;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;&#x27; + safe(item.pay) + &#x27;&lt;/strong&gt;&lt;/p&gt;&lt;button class=&quot;c-gold&quot; type=&quot;button&quot; data-apply=&quot;&#x27; + item.id + &#x27;&quot;&#x27; +
        (applied.has(item.id) ? &quot; disabled&gt;Interesse registrado&quot; : &quot;&gt;Simular candidatura ▸&quot;) + &#x27;&lt;/button&gt;&#x27;, button);
    } else if (data.apply) {
      applied.add(data.apply);
      dialogInfo.innerHTML = &#x27;&lt;p role=&quot;status&quot;&gt;Candidatura registrada na demonstração.&lt;/p&gt;&#x27;;
      one(&quot;.c-dialog-head button&quot;).focus();
    } else if (data.connect) {
      const key = data.connect;
      if (connected.has(key)) connected.delete(key);
      else connected.add(key);
      const requested = connected.has(key);
      const person = people.find((item) =&gt; item.id === key);
      all(&quot;[data-connect]&quot;).filter((item) =&gt; item.dataset.connect === key).forEach((item) =&gt; {
        item.setAttribute(&quot;aria-pressed&quot;, String(requested));
        item.setAttribute(&quot;aria-label&quot;, (requested ? &quot;Convite enviado a &quot; : &quot;Conectar com &quot;) + person.name);
        item.textContent = requested ? &quot;Convite enviado&quot; : &quot;Conectar&quot;;
      });
      status(requested ? &quot;Convite enviado.&quot; : &quot;Convite cancelado.&quot;);
    } else if (Object.hasOwn(data,&quot;conversation&quot;)) {
      conversation(data.conversation || &quot;diogo&quot;, button);
    } else if (data.like || data.save || data.comment) {
      const item = posts.find((record) =&gt; record.id === (data.like || data.save || data.comment));
      if (!item) return;
      if (data.like) {
        if (liked.has(item.id)) liked.delete(item.id);
        else liked.add(item.id);
        const count = item.likes + Number(liked.has(item.id));
        button.setAttribute(&quot;aria-pressed&quot;, String(liked.has(item.id)));
        button.querySelector(&quot;span&quot;).textContent = count;
        status(count + &quot; curtidas.&quot;);
      } else if (data.save) {
        if (saved.has(item.id)) saved.delete(item.id);
        else saved.add(item.id);
        button.setAttribute(&quot;aria-pressed&quot;, String(saved.has(item.id)));
        renderSavedPreview();
        if (page === &quot;saved&quot;) {
          renderPage();
          one(&#x27;.c-nav [data-view=&quot;saved&quot;]&#x27;).focus();
        }
        status(saved.has(item.id) ? &quot;Publicação salva.&quot; : &quot;Publicação removida dos salvos.&quot;);
      } else commentBox(item, button);
    }
  });

  one(&quot;.c-search&quot;).addEventListener(&quot;submit&quot;, (event) =&gt; {
    event.preventDefault();
    search = one(&quot;#c-q&quot;).value.trim();
    navigate(&quot;discover&quot;, event.submitter);
  });

  const draft = one(&quot;#c-draft&quot;);
  one(&quot;.c-compose&quot;).addEventListener(&quot;submit&quot;, (event) =&gt; {
    event.preventDefault();
    const text = draft.value.trim();
    if (!text) {
      draft.setCustomValidity(&quot;Escreva algo para publicar.&quot;);
      draft.reportValidity();
      return;
    }
    const author = one(&quot;#c-author&quot;).value;
    posts.unshift({ id: &quot;local-&quot; + next++, author, profile: author === viewer.name ? viewer.id : null, sprite: &quot;study&quot;, text, meta: &quot;Agora mesmo&quot;, network: true, likes: 0, comments: [] });
    draft.value = &quot;&quot;;
    renderFeed();
    draft.focus();
    status(&quot;Publicação adicionada ao feed.&quot;);
  });
  draft.addEventListener(&quot;input&quot;, () =&gt; draft.setCustomValidity(&quot;&quot;));
  dialog.addEventListener(&quot;submit&quot;, (event) =&gt; {
    if (event.target.matches(&quot;[data-comment-form]&quot;)) {
      event.preventDefault();
      const field = one(&quot;#c-reply&quot;);
      const message = field.value.trim();
      if (!message) return;
      const item = posts.find((record) =&gt; record.id === event.target.dataset.commentForm);
      if (!item) return;
      item.comments.push(message);
      if (trigger?.isConnected) trigger.querySelector(&quot;span&quot;).textContent = item.comments.length;
      commentBox(item, trigger);
      one(&quot;#c-reply&quot;).focus();
    } else if (event.target.matches(&quot;[data-reply-form]&quot;)) {
      event.preventDefault();
      const text = one(&quot;#c-reply&quot;).value.trim();
      if (!text) return;
      const messages = threads.get(activeThread) ?? [];
      threads.set(activeThread, [...messages, { sender: &quot;Você&quot;, body: text }]);
      conversation(activeThread, trigger);
      one(&quot;#c-reply&quot;).focus();
    } else if (event.target.matches(&quot;[data-edit-form]&quot;)) {
      event.preventDefault();
      const role = one(&quot;#c-edit-role&quot;);
      const about = one(&quot;#c-edit-about&quot;);
      const emptyField = [role, about].find((field) =&gt; !field.value.trim());
      if (emptyField) {
        emptyField.setCustomValidity(&quot;Preencha este campo.&quot;);
        emptyField.reportValidity();
        emptyField.addEventListener(&quot;input&quot;, () =&gt; emptyField.setCustomValidity(&quot;&quot;), { once: true });
        return;
      }
      viewer.role = role.value.trim();
      viewer.location = one(&quot;#c-edit-location&quot;).value.trim();
      viewer.about = about.value.trim();
      renderSummary();
      renderProfile();
      trigger = one(&quot;[data-edit-profile]&quot;);
      dialog.close();
      status(&quot;Perfil atualizado.&quot;);
    }
  });
  dialog.addEventListener(&quot;close&quot;, () =&gt; {
    if (trigger?.isConnected) trigger.focus();
    trigger = null;
  });

  one(&quot;.c-account&quot;).innerHTML = portrait(&quot;ana&quot;);
  one(&quot;#c-compose-avatar&quot;).innerHTML = portrait(&quot;ana&quot;);
  renderAside();
  renderFeed();
  yard();
})();
&lt;/script&gt;

&lt;script&gt;
(() =&gt; {
  let positioningReady = window.FloatingUIDOM

  const loadScript = (src) =&gt; new Promise((resolve, reject) =&gt; {

  const getPositioning = () =&gt; positioningReady ??= loadPositioning().catch((error) =&gt; {

  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;

  const getTrigger = (event) =&gt; {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest(&quot;[data-tooltip]&quot;);
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );

    } else {
      ids.delete(tooltipId);
